<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOLID ST8 LOGIC</title>
  <meta name="description" content="Projects, experiments, and things built for fun by SOLID ST8 LOGIC.">
  <meta property="og:title" content="SOLID ST8 LOGIC">
  <meta property="og:description" content="Projects, experiments, and things built for fun.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0a0e0c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0e0c'/%3E%3Cpolyline points='4,22 10,22 10,10 16,10 16,22 22,22 22,10 28,10' fill='none' stroke='%2339ff88' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0e0c;
      --panel: #111714;
      --line: #1f2a24;
      --text: #d7e3dc;
      --muted: #7f9188;
      --accent: #39ff88;
      --accent-dim: rgba(57, 255, 136, 0.12);
      --amber: #ffb347;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
      --sans: "IBM Plex Sans", system-ui, -apple-system, Segoe UI, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background:
        linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 32px 32px,
        linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 32px 32px,
        var(--bg);
      background-blend-mode: normal;
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.6;
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 50% 0%, transparent 0%, var(--bg) 70%);
      pointer-events: none;
    }
    main {
      position: relative;
      max-width: 760px;
      margin: 0 auto;
      padding: 72px 16px 48px;
    }
    .status {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--accent);
      letter-spacing: 0.08em;
      display: flex; align-items: center; gap: 10px;
    }
    .led {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2.4s ease-in-out infinite;
    }
    h1 {
      font-family: var(--mono);
      font-weight: 600;
      font-size: clamp(2.2rem, 9vw, 4rem);
      line-height: 1.05;
      letter-spacing: 0.02em;
      margin: 18px 0 12px;
    }
    h1 .eight { color: var(--accent); text-shadow: 0 0 18px rgba(57,255,136,0.45); }
    .cursor {
      display: inline-block; width: 0.55ch; height: 0.9em;
      background: var(--accent); vertical-align: -0.08em; margin-left: 6px;
      animation: blink 1.1s steps(1) infinite;
    }
    .tagline { color: var(--muted); font-size: 1.1rem; margin: 0; max-width: 34ch; }
    .wave { display: block; width: 100%; height: 44px; margin: 40px 0 36px; }
    .wave polyline {
      fill: none; stroke: var(--accent); stroke-width: 2;
      stroke-dasharray: 8 6; animation: flow 3s linear infinite;
      filter: drop-shadow(0 0 4px rgba(57,255,136,0.5));
    }
    h2 {
      font-family: var(--mono); font-size: 0.85rem; font-weight: 600;
      letter-spacing: 0.16em; color: var(--muted);
      margin: 0 0 16px;
    }
    .projects { display: grid; gap: 14px; }
    .card {
      display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center;
      padding: 18px 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: inherit; text-decoration: none;
      transition: border-color 0.2s, transform 0.2s, background 0.2s;
    }
    a.card:hover, a.card:focus-visible {
      border-color: var(--accent);
      background: linear-gradient(90deg, var(--accent-dim), var(--panel) 60%);
      transform: translateY(-2px);
      outline: none;
    }
    .idx { font-family: var(--mono); color: var(--accent); font-size: 0.9rem; }
    .card h3 { margin: 0; font-family: var(--mono); font-size: 1.1rem; font-weight: 600; letter-spacing: 0.04em; }
    .card p { margin: 2px 0 0; color: var(--muted); font-size: 0.95rem; }
    .pill {
      font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.12em;
      padding: 4px 9px; border-radius: 999px; white-space: nowrap;
      border: 1px solid currentColor;
    }
    .pill.online { color: var(--accent); }
    .pill.queued { color: var(--amber); }
    .card.pending { opacity: 0.6; border-style: dashed; }
    footer {
      margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line);
      font-family: var(--mono); font-size: 0.75rem; color: var(--muted);
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }
    @media (max-width: 480px) {
      main { padding-top: 48px; }
      .card { grid-template-columns: auto 1fr; }
      .pill { grid-column: 2; justify-self: start; }
    }
    @keyframes pulse { 50% { opacity: 0.35; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) {
      .led, .cursor, .wave polyline { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="status"><span class="led" aria-hidden="true"></span>SYSTEM ONLINE</div>
    <h1>SOLID ST<span class="eight">8</span><br>LOGIC<span class="cursor" aria-hidden="true"></span></h1>
    <p class="tagline">Projects, experiments, and things built for fun.</p>

    <svg class="wave" viewBox="0 0 600 44" preserveAspectRatio="none" aria-hidden="true">
      <polyline points="0,34 40,34 40,10 90,10 90,34 120,34 120,10 200,10 200,34 230,34 230,10 260,10 260,34 330,34 330,10 380,10 380,34 410,34 410,10 490,10 490,34 520,34 520,10 560,10 560,34 600,34"/>
    </svg>

    <h2>// PROJECTS</h2>
    <div class="projects">
      <a class="card" href="nostromo/">
        <span class="idx">01</span>
        <div>
          <h3>NOSTROMO</h3>
          <p>Ship terminal and guest status board for the movie night.</p>
        </div>
        <span class="pill online">ONLINE</span>
      </a>
      <div class="card pending">
        <span class="idx">02</span>
        <div>
          <h3>NEXT BUILD</h3>
          <p>Something new is in the queue.</p>
        </div>
        <span class="pill queued">QUEUED</span>
      </div>
    </div>

    <footer>
      <span>&copy; 2026 SOLID ST8 LOGIC</span>
      <span>STATE: 1</span>
    </footer>
  </main>
</body>
</html>
